app-id: io.github.yamanqd.antware
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: run_antware.sh
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio
cleanup:
  -  /include
  -  /lib/cmake
  -  /lib/pkgconfig
  -  /share/doc
  -  '*.a'
modules:
  - shared-modules/glew/glew.json
  - shared-modules/glu/glu-9.json
  - name: SFML
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSFML_BUILD_EXAMPLES=0
      - -DSFML_BUILD_DOC=0
      - -DSFML_BUILD_AUDIO=1
      - -DSFML_BUILD_WINDOW=1
    sources:
      - type: git
        url: https://github.com/SFML/SFML.git
        tag: 2.6.1
        commit: 69ea0cd863aed1d4092b970b676924a716ff718b

  - name: ASSIMP
    buildsystem: cmake-ninja
    config-opts:
      - -DASSIMP_NO_EXPORT=1
      - -DASSIMP_BUILD_TESTS=0
      - -DASSIMP_INJECT_DEBUG_POSTFIX=0
      - -DASSIMP_INSTALL_PDB=0
    build-options:
      cxxflags: -Wno-error=unused-but-set-variable -Wno-error
    sources:
      - type: git
        url: https://github.com/assimp/assimp.git
        tag: v5.4.3
        commit: c35200e38ea8f058812b83de2ef32c6093b0ece2

  - name: GLM
    buildsystem: simple
    build-commands:
      -  cp -r ./glm $FLATPAK_DEST/include/
    sources:
      - type: git
        url: https://github.com/g-truc/glm.git
        tag: 1.0.3
        commit: 8d1fd52e5ab5590e2c81768ace50c72bae28f2ed

  - name: rapidjson
    buildsystem: cmake-ninja
    config-opts:
      - -DRAPIDJSON_BUILD_DOC=OFF
      - -DRAPIDJSON_BUILD_EXAMPLES=OFF
      - -DRAPIDJSON_BUILD_TESTS=OFF
      - -DRAPIDJSON_BUILD_THIRDPARTY_GTEST=OFF
    sources:
      - type: git
        url: https://github.com/Tencent/rapidjson.git
        commit: 24b5e7a8b27f42fa16b96fc70aade9106cf7102f

  - name: antware
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/YamanQD/AntWare.git
        tag: 2.1.4
        commit: fe1700da80717cdddad2c9588ba41b862b11ef35
      - type: patch
        path: fix-appdata.patch
